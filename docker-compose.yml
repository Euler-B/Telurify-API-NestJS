services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sh -c "npx prisma generate && npm run start:dev"
    env_file:
      - .env
    environment:
      PORT: 3001
      DATABASE_URL: ${DOCKER_DATABASE_URL:-${DATABASE_URL}}
    ports:
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
